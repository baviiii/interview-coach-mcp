name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run e2e

  # Every push to main that passes the checks ships to Azure Container Apps.
  #
  # The image goes to GitHub's registry (ghcr.io), free for public images. It
  # holds only what this public repo already shows — config and secrets live on
  # the container app and are injected at start — so Azure pulls it with no
  # registry password.
  #
  # Azure access is keyless: GitHub mints a short-lived OIDC token and Azure
  # trades it for the deploy identity (id-gh-interview-coach-mcp-deploy), whose
  # federated credential only accepts repo:baviiii/interview-coach-mcp on
  # refs/heads/main. Forks, PRs and other branches can't obtain a token even if
  # this `if` were edited, and there is no stored password to leak.
  deploy:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: write
    # One rollout at a time, in push order; never cancel one halfway.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      RESOURCE_GROUP: rg-horus-dev
      APP: interview-coach-mcp
      IMAGE: ghcr.io/baviiii/interview-coach-mcp:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      # Tagged with the commit, so every revision traces back to one.
      - name: Build and push image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            -t "$IMAGE" .
          docker push "$IMAGE"

      # Azure pulls anonymously, so a private package would fail on Azure's side
      # with a vaguer error. Catch it here, before anything is switched.
      - name: Check Azure can pull the image
        run: |
          repo=${IMAGE#ghcr.io/}; repo=${repo%%:*}
          token=$(curl -fsS "https://ghcr.io/token?scope=repository:$repo:pull" | jq -r .token)
          status=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/$repo/manifests/${{ github.sha }}")
          if [ "$status" != 200 ]; then
            echo "::error::Image isn't publicly pullable (HTTP $status). Set the package to Public at https://github.com/users/${{ github.repository_owner }}/packages/container/interview-coach-mcp/settings, then re-run this job."
            exit 1
          fi

      # Identifiers, not credentials: they name the identity, and only a token
      # from this repo's main branch can act as it.
      - uses: azure/login@v2
        with:
          client-id: 094e53e3-a036-4097-8ca7-6e5eef44d74b
          tenant-id: 5ac8a897-d083-4f84-9021-6df508fc084b
          subscription-id: 46ee1213-0d0f-4d43-978d-1d3ec5ff85ee

      - name: Roll out new revision
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          az containerapp update -n "$APP" -g "$RESOURCE_GROUP" \
            --image "$IMAGE" --only-show-errors -o none

      # Fail the run unless the new revision comes up healthy and serves /health.
      # A failed revision gets no traffic, so the previous one keeps serving.
      - name: Verify rollout
        run: |
          revision=$(az containerapp show -n "$APP" -g "$RESOURCE_GROUP" --query properties.latestRevisionName -o tsv)
          fqdn=$(az containerapp show -n "$APP" -g "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)
          echo "Waiting for $revision"
          for _ in $(seq 1 30); do
            state=$(az containerapp revision show -n "$APP" -g "$RESOURCE_GROUP" --revision "$revision" \
              --query "[properties.healthState, properties.runningState]" -o tsv | paste -sd/ -)
            echo "  $state"
            case "$state" in
              Healthy/*) break ;;
              Unhealthy/*|*/Failed) echo "::error::Revision $revision is $state"; exit 1 ;;
            esac
            sleep 10
          done
          [[ "$state" == Healthy/* ]] || { echo "::error::Revision $revision not healthy after 5 minutes"; exit 1; }
          curl -fsS --max-time 60 "https://$fqdn/health"
          echo
          echo "Deployed ${GITHUB_SHA::7} as $revision"
