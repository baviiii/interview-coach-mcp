name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    # Pinned: ubuntu-latest moved to Ubuntu 26 on 2026-10-19, and the image
    # boot check has failed there since. 24.04 is what last passed.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run e2e
      - run: npm run build

      # Every table, column and function this server uses must still exist in
      # the live database (zero-row probes with the public key, no data read).
      # Skipped with a warning until the two repository variables are set.
      - run: npm run schema-check
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}

      # The deploy ships this Dockerfile, so prove the image actually starts on
      # every push — a broken build or start command then never reaches main.
      - name: Image boots
        run: |
          # Failures are reported as annotations too, which show on the run page
          # without signing in, unlike the log.
          if ! docker build -t mcp:ci . > build.log 2>&1; then
            echo "::error title=docker build failed::$(tail -n 15 build.log | paste -sd ' ' - | cut -c1-900)"
            cat build.log
            exit 1
          fi
          start=$(date +%s%N)
          # A database address that refuses connections: real sign-in code runs,
          # but nothing leaves the runner.
          docker run -d --name mcp -p 8787:8787 -e HORUS_MODE=mock -e RESEARCH_MODE=mock -e GROUNDING_MODE=mock \
            -e SUPABASE_URL=http://127.0.0.1:9 -e SUPABASE_ANON_KEY=ci mcp:ci
          for _ in $(seq 1 60); do
            if curl -fsS localhost:8787/health > /dev/null 2>&1; then
              echo "Healthy $(( ($(date +%s%N) - start) / 1000000 ))ms after start"
              break
            fi
            sleep 0.5
          done
          if ! curl -fsS localhost:8787/health > /dev/null; then
            echo "::error title=image did not become healthy::$(docker logs mcp 2>&1 | tail -n 15 | paste -sd ' ' - | cut -c1-900)"
            docker logs mcp
            exit 1
          fi

          # /health doesn't touch the database client, so it stayed green while
          # every signed-in request crashed (supabase-js on Node 20). A made-up
          # login must be turned away (401), not crash the request (500).
          status=$(curl -s -o body.json -w '%{http_code}' -X POST localhost:8787/api/resources \
            -H 'Content-Type: application/json' -H 'Authorization: Bearer not-a-real-token' -d '{}')
          if [ "$status" != 401 ]; then
            echo "::error::A signed-in request answered $status, expected 401: $(cat body.json)"
            docker logs mcp
            exit 1
          fi
          echo "Signed-in requests reach the sign-in check (401 for a made-up login)"

  # Every push to main that passes the checks ships to AWS Lambda.
  #
  # The image goes to the account's private ECR repository (Lambda can only run
  # images from ECR) and the function is rolled onto it. Settings and secrets
  # live on the function, managed by OpenTofu in horus-platform
  # (infrastructure/tofu/envs/aws-dev/mcp.tf), and survive every deploy.
  #
  # AWS access is keyless: GitHub mints a short-lived OIDC token and AWS trades
  # it for the deploy role, whose trust policy only accepts
  # repo:baviiii/interview-coach-mcp on refs/heads/main. Forks, PRs and other
  # branches can't assume it even if this `if` were edited, and there is no
  # stored key to leak. The role may push this one repository and update this
  # one function's code, nothing else.
  deploy:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Pinned: ubuntu-latest moved to Ubuntu 26 on 2026-10-19, and the image
    # boot check has failed there since. 24.04 is what last passed.
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    # One rollout at a time, in push order; never cancel one halfway.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      AWS_REGION: ap-southeast-2
      FUNCTION: horus-dev-interview-coach-mcp
      REPOSITORY: interview-coach-mcp
    steps:
      - uses: actions/checkout@v4

      # An identifier, not a credential: it names the role, and only a token
      # from this repo's main branch can assume it.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::293310830654:role/horus-dev-interview-coach-mcp-deploy
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Tagged with the commit, so every version traces back to one. No
      # provenance attestation: Lambda rejects the multi-manifest image that
      # buildx produces with one.
      - name: Build and push image
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/$REPOSITORY:${{ github.sha }}"
          docker build --provenance=false -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # The function itself is created by OpenTofu once a first image exists
      # (mcp_image_tag in horus-platform). Until then this only publishes it.
      - name: Roll out to Lambda
        run: |
          if ! aws lambda get-function --function-name "$FUNCTION" > /dev/null 2>&1; then
            echo "::notice::$FUNCTION doesn't exist yet. Image pushed as ${GITHUB_SHA}; set mcp_image_tag to it in horus-platform's aws-dev tfvars and apply."
            echo "SKIP_VERIFY=1" >> "$GITHUB_ENV"
            exit 0
          fi
          aws lambda update-function-code --function-name "$FUNCTION"             --image-uri "$IMAGE" --query LastUpdateStatus --output text
          aws lambda wait function-updated --function-name "$FUNCTION"

      # Fail the run unless the new code serves /health. The first request
      # after a rollout is a cold start (image pull + Node boot), so retry.
      - name: Verify rollout
        if: env.SKIP_VERIFY != '1'
        run: |
          url=$(aws lambda get-function-url-config --function-name "$FUNCTION" --query FunctionUrl --output text)
          for attempt in 1 2 3 4; do
            if curl -fsS --max-time 60 "${url%/}/health"; then
              echo
              echo "Deployed ${GITHUB_SHA::7} to $FUNCTION"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$FUNCTION did not serve /health after the rollout"
          exit 1
